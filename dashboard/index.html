<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Trending 中文日报</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --orange: #d29922;
    --pink: #f778ba;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }
  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(13, 17, 23, 0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
  }
  .header-inner {
    max-width: 1200px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  .title { font-size: 20px; font-weight: 700; }
  .title span { color: var(--accent); }
  .meta { color: var(--muted); font-size: 13px; }
  .stats { display: flex; gap: 20px; flex-wrap: wrap; }
  .stat { text-align: center; }
  .stat .num { font-size: 22px; font-weight: 700; color: var(--accent); }
  .stat .label { font-size: 12px; color: var(--muted); }
  .toolbar {
    max-width: 1200px; margin: 16px auto; padding: 0 24px;
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
  }
  .search {
    flex: 1; min-width: 200px;
    padding: 8px 14px; background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 14px; outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .lang-filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .lang-tag {
    padding: 4px 12px; border-radius: 16px; font-size: 12px; cursor: pointer;
    background: var(--card); border: 1px solid var(--border); color: var(--muted);
    transition: all 0.15s;
  }
  .lang-tag:hover { border-color: var(--accent); color: var(--text); }
  .lang-tag.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 24px 48px; }
  .repo-list { display: grid; gap: 12px; }
  .repo-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 20px; transition: border-color 0.15s;
  }
  .repo-card:hover { border-color: var(--accent); }
  .repo-card .rank {
    display: inline-block; width: 28px; height: 28px; line-height: 28px;
    text-align: center; border-radius: 6px; font-weight: 700; font-size: 13px;
    background: var(--border); color: var(--muted); margin-right: 10px;
  }
  .repo-card.top3 .rank { background: var(--orange); color: #000; }
  .repo-name {
    font-size: 15px; font-weight: 600; color: var(--accent); text-decoration: none;
  }
  .repo-name:hover { text-decoration: underline; }
  .repo-owner { color: var(--muted); font-weight: 400; }
  .repo-desc { color: var(--muted); font-size: 13px; margin: 8px 0 10px 38px; line-height: 1.5; }
  .repo-meta { display: flex; gap: 16px; flex-wrap: wrap; margin-left: 38px; font-size: 12px; }
  .repo-meta .item { display: flex; align-items: center; gap: 4px; color: var(--muted); }
  .repo-meta .lang-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .repo-meta .stars { color: var(--orange); }
  .repo-meta .today { color: var(--green); font-weight: 600; }
  .empty {
    text-align: center; padding: 80px 20px; color: var(--muted);
  }
  .empty h2 { font-size: 18px; margin-bottom: 8px; }
  .footer { text-align: center; padding: 24px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); }
</style>
</head>
<body>
  <div class="header">
    <div class="header-inner">
      <div>
        <div class="title">GitHub Trending <span>中文日报</span></div>
        <div class="meta" id="meta">加载中...</div>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </div>
  <div class="toolbar">
    <input class="search" id="search" placeholder="🔍 搜索项目名称或描述..." />
    <div class="lang-filters" id="langFilters"></div>
  </div>
  <div class="container">
    <div class="repo-list" id="repoList"></div>
  </div>
  <div class="footer">由 GitHub Trending 分析工具自动生成 · 数据仅供参考</div>

<script src="data.js"></script>
<script>
(function () {
  var data = window.__TRENDING_DATA__;
  var repoList = document.getElementById('repoList');
  var metaEl = document.getElementById('meta');
  var statsEl = document.getElementById('stats');
  var langFilters = document.getElementById('langFilters');
  var searchInput = document.getElementById('search');
  var activeLang = '';
  var keyword = '';

  if (!data) {
    repoList.innerHTML = '<div class="empty"><h2>暂无数据</h2><p>请先运行 <code>node scripts/run-analysis.mjs --period daily</code> 生成数据</p></div>';
    return;
  }

  var periodMap = { daily: '每日', weekly: '每周', monthly: '每月' };
  metaEl.textContent = '📅 ' + data.date + '  ·  ' + (periodMap[data.period] || data.period) + '榜单  ·  更新于 ' + new Date(data.generatedAt).toLocaleString('zh-CN');

  statsEl.innerHTML =
    statHtml(data.totalRepos, '项目') +
    statHtml(data.languages.length, '语言') +
    statHtml(data.repos.reduce(function (s, r) { return s + (r.starsToday || 0); }, 0), '新增 ⭐');

  function statHtml(num, label) {
    return '<div class="stat"><div class="num">' + num + '</div><div class="label">' + label + '</div></div>';
  }

  var langColors = {
    'Python': '#3572A5', 'JavaScript': '#f1e05a', 'TypeScript': '#3178c6',
    'Go': '#00ADD8', 'Rust': '#dea584', 'Java': '#b07219', 'C++': '#f34b7d',
    'C': '#555555', 'C#': '#178600', 'Ruby': '#701516', 'PHP': '#4F5D95',
    'Swift': '#F05138', 'Kotlin': '#A97BFF', 'Dart': '#00B4AB', 'Vue': '#41b883',
    'HTML': '#e34c26', 'CSS': '#563d7c', 'Shell': '#89e051', 'Lua': '#000080',
    'Jupyter Notebook': '#DA5B0B', 'Zig': '#ec915c', '未标注': '#8b949e',
  };

  data.languages.slice(0, 15).forEach(function (l) {
    var tag = document.createElement('span');
    tag.className = 'lang-tag';
    tag.textContent = l.language + ' (' + l.count + ')';
    tag.dataset.lang = l.language;
    tag.onclick = function () {
      activeLang = activeLang === l.language ? '' : l.language;
      updateLangFilters();
      render();
    };
    langFilters.appendChild(tag);
  });

  function updateLangFilters() {
    langFilters.querySelectorAll('.lang-tag').forEach(function (t) {
      t.classList.toggle('active', t.dataset.lang === activeLang);
    });
  }

  searchInput.addEventListener('input', function () {
    keyword = this.value.toLowerCase().trim();
    render();
  });

  function render() {
    var filtered = data.repos.filter(function (r) {
      if (activeLang && (r.language || '未标注') !== activeLang) return false;
      if (keyword) {
        var text = (r.fullName + ' ' + r.description).toLowerCase();
        if (text.indexOf(keyword) < 0) return false;
      }
      return true;
    });

    if (filtered.length === 0) {
      repoList.innerHTML = '<div class="empty"><h2>未找到匹配项目</h2></div>';
      return;
    }

    repoList.innerHTML = filtered.map(function (r) {
      var rank = data.repos.indexOf(r) + 1;
      var top3 = rank <= 3 ? ' top3' : '';
      var langColor = langColors[r.language] || '#8b949e';
      var lang = r.language ? '<span class="item"><span class="lang-dot" style="background:' + langColor + '"></span>' + r.language + '</span>' : '';
      var desc = r.description ? '<div class="repo-desc">' + escapeHtml(r.description) + '</div>' : '';
      var today = r.starsToday ? '<span class="item today">📈 +' + r.starsToday + ' 今日</span>' : '';
      return '<div class="repo-card' + top3 + '">' +
        '<span class="rank">' + rank + '</span>' +
        '<a class="repo-name" href="' + r.url + '" target="_blank">' +
        '<span class="repo-owner">' + r.owner + ' / </span>' + r.repo + '</a>' +
        desc +
        '<div class="repo-meta">' + lang +
        '<span class="item stars">⭐ ' + r.stars.toLocaleString() + '</span>' +
        '<span class="item">⑂ ' + r.forks.toLocaleString() + '</span>' +
        today + '</div></div>';
    }).join('');
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  render();
})();
</script>
</body>
</html>
